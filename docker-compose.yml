services:
  postgres:
    image: postgres:17-alpine
    container_name: cantina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cantina
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - cantina-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cantina"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Storage S3-compatível para imagens de produto (P9).
  minio:
    image: minio/minio:latest
    container_name: cantina-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cantina-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cantina-pgdata:
  cantina-minio:
